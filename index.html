<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a237e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ハングル">
<link rel="manifest" href="manifest.webmanifest">

<body>
<header><h1>ハングル れんしゅう</h1></header>

<main>

  <section id="view-table" class="view">
    <div class="seg" id="table-seg">
      <button data-t="letters" class="on">もじ</button>
      <button data-t="syl">組合せ</button>
      <button data-t="pat">パッチム</button>
      <button data-t="word">たんご</button>
    </div>
    <div id="table-area"></div>
  </section>

  <section id="view-stats" class="view"></section>
</main>

<nav>
  <button data-v="home" class="on"><span>🏠</span>ホーム</button>
  <button data-v="table"><span>あ</span>ひょう</button>
  <button data-v="stats"><span>★</span>きろく</button>
</nav>

<div id="lesson" hidden></div>
<div id="toast" hidden></div>
<canvas id="confetti"></canvas>

<script src="audio/map.js"></script>
<script src="data.js"></script>
<script src="data2.js"></script>
<script src="app.js"></script>
